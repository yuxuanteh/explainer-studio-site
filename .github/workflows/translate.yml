# 自动翻译：你发布（不是草稿）一篇文章或测验后，如果它还没有另一种语言的版本，
# Claude 会帮你翻译，存成「草稿」。你在 Pages CMS 检查一下，取消勾选「草稿」再保存，就会发布。
# 翻译规则写在 scripts/translate-prompt.md，可以自己改。
# 需要在 GitHub 仓库的 Settings → Secrets 里放 CLAUDE_CODE_OAUTH_TOKEN（用 claude setup-token 产生）。
name: Auto-translate posts & quizzes

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/content/quizzes/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里：Claude 运行时读不到它，只在最后 push 时临时用一下。
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # 这个 job 带着 OAuth token 运行：不要依赖缓存（setup-node v5+ 见到 packageManager 字段会自动开缓存）。
          package-manager-cache: false

      - id: find
        run: node scripts/find-missing-twins.mjs

      - if: steps.find.outputs.count != '0' && env.HAS_TOKEN != 'true'
        run: echo "::warning::Some content needs translating, but the CLAUDE_CODE_OAUTH_TOKEN secret is not set."

      - name: Translate with Claude
        if: steps.find.outputs.count != '0' && env.HAS_TOKEN == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PAIRS: ${{ steps.find.outputs.pairs }}
        run: |
          # 固定版本：这一步带着 CLAUDE_CODE_OAUTH_TOKEN 运行，不要自动装最新版。升级时改这里的版本号。
          npm install -g @anthropic-ai/claude-code@2.1.318
          { cat scripts/translate-prompt.md; echo; echo "$PAIRS"; } > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" --allowedTools "Read,Write,Glob" --output-format text

      - name: Save translations
        if: steps.find.outputs.count != '0' && env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/content/posts src/content/quizzes
          if git diff --cached --quiet; then echo "::error::Claude did not write any file."; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-translate (draft): $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF_NAME"
